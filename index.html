<!DOCTYPE html>
<html>
<head>
    <title>My HTML Web</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <p>WELCOME TO MY WEBSITE</p>
    
    <img src="https://coincodecap.com/wp-content/uploads/2023/11/image-102-12.jpg.webp" width="250">
    <p>If you want to see 
        <a href="https://coincodecap.com/wp-content/uploads/2023/11/image-102-12.jpg.webp" target="_blank">Eren images</a> 
        click here.
    </p>

    <figure>
        <p>
            <img src="https://static1.srcdn.com/wordpress/wp-content/uploads/2020/04/Attack-On-Titan-Season-1-Special-Operations-Squad.jpg?q=50&fit=crop&w=1140&h=&dpr=1.5" alt="Eren friends" width="300">
        </p>
    </figure>

    <h2>Levi Squad</h2>
    <ul>
        <li>Mikasa</li>
        <li>Armin</li>
        <li>Connie</li>
        <li>Levi</li>
        <li>Jean</li>
        <li>Sasha</li>
    </ul> 

    <p>Their <strong>ranks</strong></p> 
    <ol>
        <li>Levi</li>
        <li>Mikasa</li>
        <li>Eren</li>
    </ol>

    <section>
        <fieldset>
            <legend>Which anime do you want to watch?</legend>   
            <label><input type="radio" name="choice" value="Go back"> Go back</label>
            <label><input type="radio" name="choice" value="Search here" checked> Search here</label>
            <input type="text" id="animeInput" placeholder="Type here..." required>
        </fieldset>
        <button type="button" id="searchButton">Search</button>
    </section>

    <fieldset>
        <legend>What genre do you prefer?</legend>
        <input type="checkbox" id="Dark fantasy" name="genre" value="Dark fantasy" >
        <label for="Dark fantasy">Dark fantasy</label>
        <input type="checkbox" id="Slice of life" name="genre" value="Slice of life">
        <label for="Slice of life">Slice of life</label>
        <input type="checkbox" id="Military" name="genre" value="Military">
        <label for="Military">Military</label>
    </fieldset>

    <footer>
    <p>Author: Shayan Raees | Anime: 
        <a href="https://static1.srcdn.com/wordpress/wp-content/uploads/2024/01/characters-of-attack-on-titan-season-4.jpg?q=70&fit=crop&w=1140&h=&dpr=1" target="_blank">
            Attack on Titan
        </a>
    </p>
</footer>
<script src="./script.js"></script>
</body>

</html>
